version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - noctx
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    sloglint:
      attr-only: true
      static-msg: true
      key-naming-case: snake
    modernize:
      disable:
        # omitempty -> omitzero changes JSON marshaling on struct-typed fields.
        - omitzero
        # new(expr) rewrites leave //go:fix inline wrappers and mixed call sites.
        - newexpr
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sortie-ai/sortie

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
