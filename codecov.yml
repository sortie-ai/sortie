# yaml-language-server: $schema=https://www.schemastore.org/codecov.json

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 75%

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  require_changes: true

ignore:
  - "internal/adaptertest/**"
  - "internal/qualification/probe/toolserver_unix.go"
  - "**/*_gen.go"
