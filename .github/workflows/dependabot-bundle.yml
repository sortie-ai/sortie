# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Dependabot dashboard bundle

# A dashboard dependency update changes the committed bundle, which
# Dependabot cannot rebuild, so its CI run fails the output drift check.
on:
  workflow_run:
    workflows: [CI]
    types:
      - completed

permissions: {}

concurrency:
  group: dependabot-bundle-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the dashboard
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/web/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.drift.outputs.drift }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: make ui-install

      - name: Build
        run: make ui-build

      - name: Detect drift
        id: drift
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- internal/server/ui/dist)" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "The committed bundle matches a fresh build"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload bundle
        if: steps.drift.outputs.drift == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-bundle
          path: internal/server/ui/dist
          if-no-files-found: error
          retention-days: 1

  # The bot token never meets the updated packages: this job runs no npm
  # code and only commits the files the build job produced.
  push:
    name: Commit the bundle
    needs: build
    if: needs.build.outputs.drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Replace the bundle
        run: rm -rf internal/server/ui/dist

      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-bundle
          path: internal/server/ui/dist

      # [dependabot skip] lets Dependabot keep rebasing the PR; each rebase
      # drops this commit and the next failed run rebuilds it.
      # A push with the bot token, unlike the workflow token, starts CI.
      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.CICDBOT_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          bot_id=$(gh api user --jq .id)
          bot_login=$(gh api user --jq .login)

          git add -A -- internal/server/ui/dist
          git -c "user.name=${bot_login}" -c "user.email=${bot_id}+${bot_login}@users.noreply.github.com" \
            commit -m "build(web): regenerate the dashboard bundle [dependabot skip]"

          gh auth setup-git
          git push origin "HEAD:refs/heads/${BRANCH}"
