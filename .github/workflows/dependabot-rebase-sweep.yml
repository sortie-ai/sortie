# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Dependabot rebase sweep

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

concurrency:
  group: dependabot-rebase-sweep
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  sweep:
    uses: sortie-ai/shared-workflows/.github/workflows/dependabot-rebase-sweep.yml@12099056fde09c3b1ef701128316e9fb883eba90 # v1.1.0
    secrets:
      bot-token: ${{ secrets.CICDBOT_TOKEN }}
