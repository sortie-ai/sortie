name: CI

on:
  push:
    branches:
      # This is to make sure that there is no broken CI on
      # the main branch, and also for Sonarqube integration
      - main
  # We need it for better Sonarqube integration
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Cancel any currently running job or workflow in the same concurrency group.
  # The group is a unique identifier for the workflow run.
  #
  # Explanation:
  # - github.workflow: The name of the workflow (e.g. Workflow 1).
  # - github.event.pull_request.number: The number of the pull request (when the trigger event is a PR).
  # - github.ref_name: The short branch or tag name (when the trigger is not a PR but a push).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .tool-versions
          verify: false
          # Skip the action's analysis cache: stale entries cause flaky
          # staticcheck false positives (golangci-lint#5979) that would otherwise
          # masquerade as new 'latest' findings. setup-go's caches are unaffected.
          skip-cache: true

      - name: Lint shell scripts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only --diff-filter=d "$BASE_SHA" HEAD -- '*.sh')
          else
            changed=$(git ls-files '*.sh')
          fi
          [ -n "$changed" ] || exit 0
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | xargs -d '\n' -r shellcheck -x --

  lint-unused:
    name: Lint (unused, advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No step in this job runs an authenticated git command, so the
          # token does not need to stay in the local git config.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The main Lint job leaves test files out of scope for the 'unused'
      # analyzer, so a helper reachable only from a test never turns up
      # there. This scoped, module-wide rerun is advisory: issues-exit-code=0
      # keeps it from failing the build, so it only surfaces findings for a
      # human to act on.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .tool-versions
          verify: false
          args: --default=none --enable=unused --tests=false --issues-exit-code=0 ./...
          # Skip the action's analysis cache: this job runs a different
          # analyzer scope than the main Lint job, and a cache shared
          # between the two could carry a result over from the wrong scope.
          skip-cache: true

  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      # secrets cannot be directly referenced in if: conditionals
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: success() && env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: false
          name: codecov-umbrella
          flags: unittests
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binary
        run: make build
