# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Issue notification

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: issue-notify
  cancel-in-progress: false

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: >-
      !contains(github.event.issue.labels.*.name, 'ci-nightly')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post new issue
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CI }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_URL: ${{ github.event.issue.user.html_url }}
          ISSUE_AUTHOR_AVATAR: ${{ github.event.issue.user.avatar_url }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "::warning::DISCORD_WEBHOOK_CI is not configured; skipping"
            exit 0
          fi

          jq -n \
            --arg title "${ISSUE_TITLE}" \
            --arg number "${ISSUE_NUMBER}" \
            --arg url "${ISSUE_URL}" \
            --arg author "${ISSUE_AUTHOR}" \
            --arg author_url "${ISSUE_AUTHOR_URL}" \
            --arg author_avatar "${ISSUE_AUTHOR_AVATAR}" \
            --argjson labels "${ISSUE_LABELS}" \
            '{
              author: {name: $author, url: $author_url, icon_url: $author_avatar},
              title: "\($title) #\($number)",
              url: $url,
              color: 3447003
            }
            + if $labels == [] then {} else {description: ($labels | join(" · "))} end' \
            >embed.json

          scripts/discord-notify.sh --embed <embed.json
