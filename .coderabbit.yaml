# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

reviews:
  high_level_summary_in_walkthrough: true

  suggested_reviewers: false
  suggested_labels: false

  in_progress_fortune: false

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"

  tools:
    golangci-lint:
      enabled: false
    shellcheck:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

chat:
  art: false
