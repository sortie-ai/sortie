# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: sortie
report_sizes: true

before:
  hooks:
    - go mod verify

builds:
  - id: sortie
    main: ./cmd/sortie
    binary: sortie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X main.Version={{ .Version }}
        -X main.Commit={{ .FullCommit }}
        -X main.Date={{ .CommitDate }}
    flags:
      - -trimpath
    tags:
      - osusergo
      - netgo
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        # Authenticode-sign Windows binaries with SignPath before archiving, so
        # the published archive and checksums cover the signed binary. The
        # script no-ops on non-Windows targets and when SignPath credentials are
        # absent (snapshots, pull requests, local builds).
        - cmd: ./scripts/signpath-sign.sh "{{ .Path }}"
          output: true

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

homebrew_casks:
  - name: sortie
    repository:
      owner: sortie-ai
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
    commit_msg_template: "chore(cask): update {{ .ProjectName }} to {{ .Tag }}"
    homepage: "https://github.com/sortie-ai/sortie"
    description: "Spec-first orchestration service for coding agents"
    license: "Apache-2.0"
    hooks:
      post:
        # macOS binaries are not notarized, so Gatekeeper would quarantine the
        # cask and block first run; drop the attribute on install.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sortie"]
          end
    skip_upload: "auto"

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([^)]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([^)]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "(?i)^docs[:(]"
      - "(?i)^tests?[:(]"
      - "(?i)^chore[:(]"
      - "(?i)^ci[:(]"
      - "(?i)^style[:(]"
      - "(?i)^refactor[:(]"
      - "(?i)^Merge pull request #"
      - "(?i)^Merge (remote-tracking )?branch '"

release:
  github:
    owner: sortie-ai
    name: sortie
  name_template: "{{ .ProjectName }} {{ .Version }}"
  footer: |
    ---

    **Full changelog**: https://github.com/sortie-ai/sortie/blob/{{ .Tag }}/CHANGELOG.md

    **Diff**: https://github.com/sortie-ai/sortie/compare/{{ .PreviousTag }}...{{ .Tag }}
  draft: false
  prerelease: auto
  make_latest: true
  mode: keep-existing

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"
